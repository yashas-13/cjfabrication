name: Build CJ Fabrications Android APK

on:
  push:
    branches:
      - android-app
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cj-fabrications-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and publish installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate APK and create checksum
        working-directory: android-app
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/CJ-Fabrications-1.0.0-debug.apk
          cd dist
          sha256sum CJ-Fabrications-1.0.0-debug.apk > SHA256SUMS.txt
          file CJ-Fabrications-1.0.0-debug.apk
          cat SHA256SUMS.txt

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cj-fabrications-android-apk
          path: |
            android-app/dist/CJ-Fabrications-1.0.0-debug.apk
            android-app/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cj-fabrications-android-build-${{ github.run_number }}
          name: CJ Fabrications Android build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          files: |
            android-app/dist/CJ-Fabrications-1.0.0-debug.apk
            android-app/dist/SHA256SUMS.txt
          body: |
            Automated installable debug-signed APK built from commit ${{ github.sha }}.

            This is a test/distribution build, not a production-signed Play Store release.
            Verify SHA256SUMS.txt before installation. The app loads the live CJ Fabrications
            web app at https://parkzone.in/cjfabrication/ and therefore requires internet access.
